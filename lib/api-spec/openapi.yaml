openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Supplement products and blends
  - name: timing
    description: Timing map generation
  - name: leads
    description: Email capture
  - name: billing
    description: Subscription checkout
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List/search supplement products
      description: Returns products matching an optional search term, both standalone compounds and blends.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/scan-label:
    post:
      operationId: scanProductLabel
      tags: [products]
      summary: Extract ingredients from a photo of a supplement label and save as a product
      description: Uses AI vision to read a supplement facts label photo and creates a new product with the extracted ingredients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanLabelInput"
      responses:
        "200":
          description: Product created from the scanned label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid input or no ingredients could be read from the image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /products/scan-label-preview:
    post:
      operationId: scanProductLabelPreview
      tags: [products]
      summary: Extract ingredients from a label photo without saving
      description: Uses AI vision to read a supplement facts label and returns extracted ingredients for user confirmation. Does not persist or contribute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanLabelInput"
      responses:
        "200":
          description: Extracted label ingredients for confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanLabelPreviewResult"
        "400":
          description: Invalid input or no ingredients could be read from the image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /products/search-web-ingredients:
    post:
      operationId: searchWebIngredients
      tags: [products]
      summary: Search trusted web sources for supplement facts
      description: Searches manufacturer sites first for a recognized product's supplement facts. Results are provisional and always require user confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchWebIngredientsInput"
      responses:
        "200":
          description: Provisional web ingredient search result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchWebIngredientsResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /products/rematch-shelf-row:
    post:
      operationId: rematchShelfRow
      tags: [products]
      summary: Re-run product and ingredient matching for an edited shelf review row
      description: Deterministically re-matches a corrected product name against verified products and the ingredient library. Does not call vision or web fetch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RematchShelfRowInput"
      responses:
        "200":
          description: Updated match result for the shelf review row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShelfDetectedProduct"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /products/scan-shelf:
    post:
      operationId: scanShelf
      tags: [products]
      summary: Detect multiple supplement products from a shelf photo
      description: Uses AI vision to identify up to 12 supplement bottles. Does not persist products until the user confirms via confirm-shelf.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanLabelInput"
      responses:
        "200":
          description: Detected products for user review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanShelfResult"
        "400":
          description: Invalid input or no products could be identified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /products/confirm-shelf:
    post:
      operationId: confirmShelf
      tags: [products]
      summary: Persist user-confirmed shelf scan products to the catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmShelfInput"
      responses:
        "200":
          description: Products created from the confirmed shelf scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmShelfResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /products/contribute-verified-product:
    post:
      operationId: contributeVerifiedProduct
      tags: [products]
      summary: Submit Supplement Facts scan as a pending verified-product contribution
      description: User-contributed ingredient data for a known commercial product. Requires review before becoming globally trusted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributeVerifiedProductInput"
      responses:
        "201":
          description: Contribution queued for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributeVerifiedProductResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /products/popular:
    get:
      operationId: listPopularProducts
      tags: [products]
      summary: List curated popular products for quick-add chips
      responses:
        "200":
          description: Popular products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /timing-map:
    post:
      operationId: generateTimingMap
      tags: [timing]
      summary: Generate a timing map from a stack and daily anchors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimingMapInput"
      responses:
        "200":
          description: Generated timing map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimingMap"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /leads:
    post:
      operationId: createLead
      tags: [leads]
      summary: Capture an email to unlock the full timing map
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Lead captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkout:
    post:
      operationId: createCheckoutSession
      tags: [billing]
      summary: Start a Stripe checkout session for the Pro plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkout/verify:
    get:
      operationId: verifyCheckoutSession
      tags: [billing]
      summary: Verify a completed Stripe checkout session
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutVerification"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Ingredient:
      type: object
      required: [name, mgAmount]
      properties:
        name:
          type: string
        mgAmount:
          type: number
    Product:
      type: object
      required: [id, name, type, ingredients]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [standalone, blend]
        badge:
          type: ["string", "null"]
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"
    ScanLabelInput:
      type: object
      required: [imageBase64, mimeType]
      properties:
        imageBase64:
          type: string
          description: Base64-encoded (no data URL prefix) photo of a supplement facts label.
        mimeType:
          type: string
          description: "Image MIME type, e.g. image/jpeg or image/png."
        productNameHint:
          type: ["string", "null"]
          description: Optional product name if visible/known, used to seed the created product's name.
        verifiedProductId:
          type: ["string", "null"]
          description: When set, submit label scan ingredients as a pending verified-product contribution.
    ScanLabelPreviewResult:
      type: object
      required: [productName, ingredients]
      properties:
        productName:
          type: string
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"
    SearchWebIngredientsInput:
      type: object
      required: [productName]
      properties:
        brand:
          type: ["string", "null"]
        productName:
          type: string
        verifiedProductId:
          type: ["string", "null"]
    RematchShelfRowInput:
      type: object
      required: [productName]
      properties:
        productName:
          type: string
        brand:
          type: ["string", "null"]
        rawOcrLines:
          type: array
          items:
            type: string
        detectionConfidence:
          type: number
          minimum: 0
          maximum: 1
        ocrConfidence:
          type: number
          minimum: 0
          maximum: 1
    SearchWebIngredientsResult:
      type: object
      required: [source, sourceLabel, ingredients, message, requiresConfirmation]
      properties:
        source:
          type: string
          enum: [manufacturer, retailer_discovery, none]
        sourceUrl:
          type: ["string", "null"]
        sourceLabel:
          type: string
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"
        message:
          type: string
        requiresConfirmation:
          type: boolean
          description: Always true — web ingredients must be confirmed by the user.
    ShelfConfidenceScores:
      type: object
      required: [detection, ocr, identity, enrichment, ingredientVerification]
      properties:
        detection:
          type: number
          minimum: 0
          maximum: 1
        ocr:
          type: number
          minimum: 0
          maximum: 1
        identity:
          type: number
          minimum: 0
          maximum: 1
        enrichment:
          type: number
          minimum: 0
          maximum: 1
        ingredientVerification:
          type: number
          minimum: 0
          maximum: 1
    ShelfEnrichment:
      type: object
      required: [status, verifyIngredientsAvailable, requiresReview]
      properties:
        status:
          type: string
          enum: [verified, provisional, pending, none]
        source:
          type: ["string", "null"]
        sourceUrl:
          type: ["string", "null"]
        verifyIngredientsAvailable:
          type: boolean
        requiresReview:
          type: boolean
        verifiedProductId:
          type: ["string", "null"]
    ShelfDetectedProduct:
      type: object
      required:
        - productName
        - confidence
        - labelEvidence
        - rawOcrLines
        - confidenceScores
        - enrichment
        - hasIngredientDetails
        - needsReview
        - ingredients
      properties:
        productName:
          type: string
        brand:
          type: ["string", "null"]
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Identity confidence (legacy summary field).
        labelEvidence:
          type: string
        rawOcrLines:
          type: array
          items:
            type: string
        confidenceScores:
          $ref: "#/components/schemas/ShelfConfidenceScores"
        enrichment:
          $ref: "#/components/schemas/ShelfEnrichment"
        hasIngredientDetails:
          type: boolean
        needsReview:
          type: boolean
          description: True when confidence is below 0.75 or identity is uncertain.
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"
    ScanShelfResult:
      type: object
      required: [products]
      properties:
        products:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/ShelfDetectedProduct"
    ShelfConfirmItem:
      type: object
      required: [productName, ingredients]
      properties:
        productName:
          type: string
        brand:
          type: ["string", "null"]
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"
    ConfirmShelfInput:
      type: object
      required: [products]
      properties:
        products:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/ShelfConfirmItem"
    ConfirmShelfResult:
      type: object
      required: [products]
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
    ContributeVerifiedProductInput:
      type: object
      required: [verifiedProductId, productName, ingredients]
      properties:
        verifiedProductId:
          type: string
        brand:
          type: ["string", "null"]
        productName:
          type: string
        ingredients:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Ingredient"
        supplementFactsText:
          type: ["string", "null"]
    ContributeVerifiedProductResult:
      type: object
      required: [id, status, verifiedProductId]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending_review, approved, rejected]
        verifiedProductId:
          type: string
        message:
          type: string
    Anchors:
      type: object
      required: [wake, breakfast, dinner, bed]
      properties:
        wake:
          type: string
          description: "24h time, HH:MM"
        breakfast:
          type: string
          description: "24h time, HH:MM"
        dinner:
          type: string
          description: "24h time, HH:MM"
        bed:
          type: string
          description: "24h time, HH:MM"
        medications:
          type: array
          description: Fixed medications the user takes at set times.
          items:
            $ref: "#/components/schemas/Medication"
        coffeeTime:
          type: ["string", "null"]
          description: "24h time, HH:MM"
    Medication:
      type: object
      required: [name, time]
      properties:
        name:
          type: string
        time:
          type: string
          description: "24h time, HH:MM"
    TimingMapInput:
      type: object
      required: [productIds, anchors]
      properties:
        productIds:
          type: array
          items:
            type: string
        anchors:
          $ref: "#/components/schemas/Anchors"
    TimingPill:
      type: object
      required: [label, isAnchor]
      properties:
        label:
          type: string
        isAnchor:
          type: boolean
        reason:
          type: ["string", "null"]
        source:
          type: ["string", "null"]
    TimingSlot:
      type: object
      required: [time, context, pills]
      properties:
        time:
          type: string
          description: "24h time, HH:MM"
        context:
          type: string
        note:
          type: ["string", "null"]
        pills:
          type: array
          items:
            $ref: "#/components/schemas/TimingPill"
    AuditItem:
      type: object
      required: [ingredientName, totalMg, products]
      properties:
        ingredientName:
          type: string
        totalMg:
          type: number
        products:
          type: array
          items:
            type: string
    Contraindication:
      type: object
      required: [severity, effect, substances, mechanism]
      properties:
        severity:
          type: string
          enum: [avoid, caution]
        effect:
          type: string
        substances:
          type: array
          items:
            type: string
        mechanism:
          type: string
        source:
          type: ["string", "null"]
    TimingMap:
      type: object
      required: [slots, audit, contraindications]
      properties:
        slots:
          type: array
          items:
            $ref: "#/components/schemas/TimingSlot"
        audit:
          type: array
          items:
            $ref: "#/components/schemas/AuditItem"
        contraindications:
          type: array
          items:
            $ref: "#/components/schemas/Contraindication"
    LeadInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    Lead:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        createdAt:
          type: string
    CheckoutInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    CheckoutSession:
      type: object
      required: [url]
      properties:
        url:
          type: ["string", "null"]
    CheckoutVerification:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
